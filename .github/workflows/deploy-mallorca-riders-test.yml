name: Deploy Mallorca Riders test worker

on:
  push:
    branches:
      - fix/poi-arrows-overpass-repair-20261030
      - feature/voz-radares-ruta-inversa
      - feature/avisos-obras-desvios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application files and JavaScript syntax
        run: |
          test -s index.html
          test -s app.js
          test -s worker.js
          test -s styles.css
          node --check app.js
          node --check worker.js

      - name: Deploy test Worker (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4887e83dc0665be474369d9c3a64ff69
          wranglerVersion: "4.157.0"
          command: deploy --config wrangler.jsonc --name mallorca-riders-proxy-test

      - name: Wait before Cloudflare retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 12

      - name: Deploy test Worker (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4887e83dc0665be474369d9c3a64ff69
          wranglerVersion: "4.157.0"
          command: deploy --config wrangler.jsonc --name mallorca-riders-proxy-test

      - name: Wait before final Cloudflare retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy test Worker (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4887e83dc0665be474369d9c3a64ff69
          wranglerVersion: "4.157.0"
          command: deploy --config wrangler.jsonc --name mallorca-riders-proxy-test

      - name: Mark deployment failed after all retries
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "All test Worker deployment attempts failed."
          exit 1

      - name: Verify deployed test Worker and application assets
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mallorca-riders-proxy-test.i-riveraseguro.workers.dev"
          HEALTH=""
          for attempt in 1 2 3 4 5; do
            HEALTH="$(curl -fsS --max-time 20 "$BASE/api/health" || true)"
            if echo "$HEALTH" | grep -q '"workerHost":"mallorca-riders-proxy-test.i-riveraseguro.workers.dev"'; then break; fi
            sleep 5
          done
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q '"build":"mrr-roadworks-2026-11-06"'
          HTML="$(curl -fsS --max-time 20 "$BASE/")"
          echo "$HTML" | grep -q 'app.js?v=75'
          APP="$(curl -fsS --max-time 20 "$BASE/app.js?v=75")"
          echo "$APP" | grep -q 'function parseDgtRoadworks'
          echo "$APP" | grep -q 'async function acceptRoadworkDetour'
          SW="$(curl -fsS --max-time 20 "$BASE/sw.js")"
          echo "$SW" | grep -q 'mrr-v17-roadworks-fix'
          echo "Verified: test Worker, app.js v75, roadworks parser, detour handler and service-worker cache."

      - name: Probe live DGT traffic feed
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          BASE="https://mallorca-riders-proxy-test.i-riveraseguro.workers.dev"
          BODY="$(mktemp)"
          STATUS="$(curl -sS --max-time 35 -o "$BODY" -w '%{http_code}' "$BASE/api/traffic/incidents" || true)"
          echo "DGT endpoint HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] && grep -Eiq '<[^>]*(d2LogicalModel|situationPublication|SituationPublication)' "$BODY"; then
            echo "DGT feed probe: valid DATEX II XML received."
          else
            echo "DGT feed probe: NOT VERIFIED. Response follows:"
            head -c 1200 "$BODY" || true
          fi
          rm -f "$BODY"
