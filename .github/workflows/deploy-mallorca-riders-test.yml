name: Deploy Mallorca Riders test worker

on:
  push:
    branches:
      - fix/poi-arrows-overpass-repair-20261030
      - feature/voz-radares-ruta-inversa
      - feature/avisos-obras-desvios
      - fix/circular-route-quality-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application files and JavaScript syntax
        run: |
          test -s index.html
          test -s app.js
          test -s worker.js
          test -s styles.css
          node --check app.js
          node --check worker.js

      - name: Deploy test Worker (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4887e83dc0665be474369d9c3a64ff69
          wranglerVersion: "4.157.0"
          command: deploy --config wrangler.jsonc --name mallorca-riders-proxy-test

      - name: Wait before Cloudflare retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 12

      - name: Deploy test Worker (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4887e83dc0665be474369d9c3a64ff69
          wranglerVersion: "4.157.0"
          command: deploy --config wrangler.jsonc --name mallorca-riders-proxy-test

      - name: Wait before final Cloudflare retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy test Worker (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4887e83dc0665be474369d9c3a64ff69
          wranglerVersion: "4.157.0"
          command: deploy --config wrangler.jsonc --name mallorca-riders-proxy-test

      - name: Mark deployment failed after all retries
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "All test Worker deployment attempts failed."
          exit 1

      - name: Verify deployed test Worker and application assets
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://mallorca-riders-proxy-test.i-riveraseguro.workers.dev"
          HEALTH=""
          for attempt in 1 2 3 4 5; do
            HEALTH="$(curl -fsS --max-time 20 "$BASE/api/health" || true)"
            if [[ "$HEALTH" == *'"workerHost":"mallorca-riders-proxy-test.i-riveraseguro.workers.dev"'* ]]; then break; fi
            sleep 5
          done
          echo "$HEALTH"
          [[ "$HEALTH" == *'"status":"ok"'* ]]
          [[ "$HEALTH" == *'"build":"mrr-roadworks-2026-11-06-v5"'* ]]
          HTML="$(curl -fsS --max-time 20 "$BASE/")"
          [[ "$HTML" == *'app.js?v=82'* ]]
          APP="$(curl -fsS --max-time 20 "$BASE/app.js?v=82")"
          [[ "$APP" == *'function parseDgtRoadworks'* ]]
          [[ "$APP" == *'async function acceptRoadworkDetour'* ]]
          [[ "$APP" == *'function roadworkWarningThresholds'* ]]
          [[ "$APP" == *'function roadworkAvoidPoints'* ]]
          [[ "$APP" == *"validitystatus"*"active"* ]]
          [[ "$APP" == *"preserveRoadworkHandled"* ]]
          [[ "$APP" == *"const grouped=[]"* ]]
          [[ "$APP" == *"function circularRouteMetrics"* ]]
          [[ "$APP" == *"function peninsulaCircularWaypoints"* ]]
          [[ "$APP" == *"ROUTE_NOT_CIRCULAR"* ]]
          [[ "$APP" == *"circular-antihorario-"* ]]
          [[ "$APP" == *"overlapRatio<=0.34"* ]]
          [[ "$APP" == *"overlapRatio*4.5"* ]]
          SW="$(curl -fsS --max-time 20 "$BASE/sw.js")"
          [[ "$SW" == *'mrr-v24-circular-quality-v2'* ]]
          echo "Verified: test Worker, app.js v81, circular-route validation, optional GPS start, adaptive roadworks alerts and service-worker cache."

      - name: Probe live DGT traffic feed
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          BASE="https://mallorca-riders-proxy-test.i-riveraseguro.workers.dev"
          BODY="$(mktemp)"
          STATUS="$(curl -sS --max-time 35 -o "$BODY" -w '%{http_code}' "$BASE/api/traffic/incidents" || true)"
          echo "DGT endpoint HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] && grep -Eiq '<[^>]*(d2LogicalModel|situationPublication|SituationPublication)' "$BODY"; then
            echo "DGT feed probe: valid DATEX II XML received."
            python3 - "$BODY" <<'PY'
          import re, sys
          from datetime import datetime, timezone
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          def local(tag):
              return tag.rsplit("}", 1)[-1].split(":")[-1].lower()
          records = [node for node in root.iter() if local(node.tag) == "situationrecord"]
          types, geometry_counts = set(), {"pointcoordinates":0,"latlon":0,"pos":0,"poslist":0}
          located = work_candidates = work_with_geometry = balearic_work_records = 0
          current_work_records = current_balearic_work_records = 0
          now = datetime.now(timezone.utc)
          samples, balearic_samples = [], []
          work_type = re.compile(r"roadworks?|maintenancework|roadclosure|carriagewayclosure|laneclosure", re.I)
          work_text = re.compile(r"\b(obras?|trabajos de mantenimiento|corte(?:s)? de carretera|carretera cortada|calzada cortada|carril cortado|desvío|desvio)\b|\broadworks?\b|\broad closed\b|\blane closure\b", re.I)
          for record in records:
              kind = next((value.split(":")[-1] for key,value in record.attrib.items() if local(key)=="type"), "")
              types.add(kind)
              nodes = list(record.iter())
              names = [local(node.tag) for node in nodes]
              geometry_counts["pointcoordinates"] += names.count("pointcoordinates")
              geometry_counts["pos"] += names.count("pos")
              geometry_counts["poslist"] += names.count("poslist")
              has_latlon = "latitude" in names and "longitude" in names
              geometry_counts["latlon"] += int(has_latlon)
              coordinates = []
              for container in [node for node in nodes if local(node.tag)=="pointcoordinates"]:
                  child = list(container.iter())
                  lat = next((node.text for node in child if local(node.tag)=="latitude" and node.text),None)
                  lon = next((node.text for node in child if local(node.tag)=="longitude" and node.text),None)
                  if lat and lon: coordinates.append((lat,lon))
              if not coordinates and has_latlon:
                  lats=[node.text for node in nodes if local(node.tag)=="latitude" and node.text]
                  lons=[node.text for node in nodes if local(node.tag)=="longitude" and node.text]
                  coordinates.extend(zip(lats,lons))
              if not coordinates:
                  for node in nodes:
                      name=local(node.tag)
                      if name in ("pos","poslist") and node.text:
                          vals=node.text.strip().replace(",", " ").split()
                          if len(vals)>=2: coordinates.append((vals[0],vals[1]))
              if coordinates: located += 1
              full_text=" ".join((node.text or "").strip() for node in nodes)
              is_work=bool(work_type.search(kind) or work_text.search(full_text))
              if is_work:
                  work_candidates += 1
                  if coordinates: work_with_geometry += 1
                  status_values=[(node.text or "").strip().lower() for node in nodes if local(node.tag)=="validitystatus" and (node.text or "").strip()]
                  starts=[(node.text or "").strip() for node in nodes if local(node.tag) in ("overallstarttime","validitystarttime","starttime") and (node.text or "").strip()]
                  ends=[(node.text or "").strip() for node in nodes if local(node.tag) in ("overallendtime","endofperiod","validityendtime") and (node.text or "").strip()]
                  parse_date=lambda value: datetime.fromisoformat(value.replace("Z","+00:00"))
                  start_date=next((parse_date(value) for value in starts if value),None)
                  end_date=next((parse_date(value) for value in ends if value),None)
                  is_current=(not status_values or "active" in status_values) and (start_date is None or start_date<=now) and (end_date is None or end_date>=now)
                  is_balearic = any(38.6 <= float(lat) <= 40.2 and 1.0 <= float(lon) <= 4.5 for lat,lon in coordinates)
                  if is_current:
                      current_work_records += 1
                      if is_balearic: current_balearic_work_records += 1
                  if is_balearic:
                      balearic_work_records += 1
                      if len(balearic_samples)<8:
                          time_fields=[(local(node.tag), (node.text or "").strip()) for node in nodes if "time" in local(node.tag) and (node.text or "").strip()]
                          status_fields=[(local(node.tag), (node.text or "").strip()) for node in nodes if ("status" in local(node.tag) or "validity" in local(node.tag)) and (node.text or "").strip()]
                          balearic_samples.append({"type":kind,"coordinates":coordinates[:3],"times":time_fields[:12],"status":status_fields[:12],"current":is_current,"text":full_text[:260]})
                  if len(samples)<4:
                      time_fields=[(local(node.tag), (node.text or "").strip()) for node in nodes if "time" in local(node.tag) and (node.text or "").strip()]
                      samples.append({"type":kind,"coordinate_examples":coordinates[:2],"times":time_fields[:8],"text":full_text[:240]})
          print("DATEX root:", local(root.tag))
          print("SituationRecord count:", len(records))
          print("Records with coordinate geometry (same extraction path as app):", located)
          print("Geometry element counts:", geometry_counts)
          print("Potential works/closures/descriptions:", work_candidates)
          print("Potential works with extractable coordinates:", work_with_geometry)
          print("Potential works in Balearic bounding area:", balearic_work_records)
          print("Currently active/in-period works (same status and date filters as app):", current_work_records)
          print("Currently active/in-period works in Balearic bounding area:", current_balearic_work_records)
          print("SituationRecord types:", ", ".join(sorted(types)) or "(none in this feed)")
          print("Sample work records:", samples)
          print("Sample Balearic work records with date/time fields:", balearic_samples)
          PY
          else
            echo "DGT feed probe: NOT VERIFIED. Response follows:"
            head -c 1200 "$BODY" || true
          fi
          rm -f "$BODY"
